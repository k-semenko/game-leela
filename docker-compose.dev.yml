# Hot-reload overlay. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Bot is opt-in: add --profile bot (needs real TG_BOT_TOKEN)
#
# Overrides prod-like `run` targets with `run_dev` + bind mounts.
services:
  bff:
    build:
      target: run_dev
    volumes:
      - ./apps/bff:/app
      - bff_node_modules:/app/node_modules
    command: npm run start:dev

  bot:
    build:
      target: run_dev
    volumes:
      - ./apps/bot:/app
      - bot_node_modules:/app/node_modules
    command: npm run start:dev

  frontend:
    build:
      target: run_dev
    ports:
      - "${FRONT_PORT:-4200}:4200"
    volumes:
      - ./apps/frontend:/app
      - front_node_modules:/app/node_modules
    command: npm run start -- --host 0.0.0.0 --port 4200 --configuration local
    environment:
      ENV: local

volumes:
  bff_node_modules:
  bot_node_modules:
  front_node_modules:
